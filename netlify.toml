# Static export: `next build` writes plain files to out/ and Netlify serves
# them directly. No Next.js runtime, no serverless functions.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every response, HTML pages included (static files are
# served straight from the CDN, so these rules are the only place they're set).
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — no one can embed LTM in an iframe
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Force HTTPS always
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Control what info is sent when clicking external links
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only LTM's own origin. Fonts are self-hosted by next/font, the map embed
    # is gone, and the site has no forms. 'unsafe-inline' is required for the
    # inline scripts/styles Next.js emits in a static export.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    # Limit browser features LTM doesn't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # REMOVE AT DOMAIN CUTOVER — keeps the staging domain out of search results.
    X-Robots-Tag = "noindex"

# Next.js build output has content hashes in its filenames — cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site images keep stable filenames, so they can change in place — cache 1 week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/signs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
